spring.application.name=payment_service
server.port=8081
server.servlet.context-path=/api/v1

## DATABASE
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

### Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:/db/migration
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.root=INFO
logging.level.com.smartspotsolutions.StockPoint=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=debug

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.process.enabled=true

# Application verification configurations
app.verification.email.expiry-minutes=30
app.reset.password.expiry-minutes=15

jwt.cookie.secure=true
jwt.cookie.max-age-days=2

spring.messages.encoding=utf-8

# Email Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp

#==============================
# Environment-driven settings #
#==============================

spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret.key=${JWT_SECRET_KEY}

app.admin.password=${APP_ADMIN_PASSWORD}

# Google OAuth2 (Web)
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}

# Email
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.from=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_FROM}

# Main App
stock.point.url=${STOCK_POINT_URL}

# Daraja
daraja.consumer.key=${DARAJA_CONSUMER_KEY}
daraja.consumer.secret=${DARAJA_CONSUMER_SECRET}
daraja.passkey=${DARAJA_PASSKEY}
daraja.callback.url=${DARAJA_CALLBACK_URL}
daraja.shortcode=${DARAJA_SHORT_CODE}